<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BG5GIZ.COM</title>
    <style>
        /* 全局重置 & 基础 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f7fa;
            padding: 20px;
        }

        /* 卡片容器 —— 居中、舒适、不拥挤 */
        .card {
            max-width: 560px;
            width: 100%;
            background: #ffffff;
            border-radius: 20px;
            padding: 44px 40px 36px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
            transition: box-shadow 0.25s ease;
        }

        /* --- 醒目标题（新增） --- */
        .main-title {
            font-size: 32px;
            font-weight: 800;
            text-align: center;
            color: #0f172a;
            letter-spacing: 2px;
            margin-bottom: 28px;
            padding-bottom: 18px;
            border-bottom: 2.5px solid #eef2f6;
            word-break: break-word;
        }

        /* 每一条信息 */
        .info-item {
            display: flex;
            align-items: baseline;
            padding: 14px 0;
            border-bottom: 1px solid #eef0f2;
        }

        .info-item:last-of-type {
            border-bottom: none;
        }

        /* 左侧标签 */
        .label {
            width: 100px;
            flex-shrink: 0;
            font-size: 16px;
            font-weight: 500;
            color: #1e293b;
            letter-spacing: 0.3px;
        }

        /* 右侧内容（留空区域） */
        .value {
            /* flex: 1;
            font-size: 16px;
            color: #94a3b8;
            /* 浅灰色占位感，表示待填 */
            /*padding-left: 8px;
            min-height: 28px;
            border-bottom: 1.5px dashed #dce0e6;
            /* 虚线占位，清晰可见 */
            transition: border-color 0.2s;
        }

        /* 让占位更明显一点，但又不抢眼 */
        /*.value::before {
            content: "————————";
            color: #dce0e6;
            letter-spacing: 1px;
            font-weight: 300;
        }

        /* 响应式：小屏下标签稍作调整 */
        @media (max-width: 480px) {
            .card {
                padding: 30px 18px 24px;
            }

            .main-title {
                font-size: 26px;
                margin-bottom: 20px;
                padding-bottom: 14px;
            }

            .info-item {
                flex-wrap: wrap;
                padding: 12px 0;
            }

            .label {
                width: 100%;
                font-size: 15px;
                margin-bottom: 4px;
            }

            .value {
                width: 100%;
                padding-left: 0;
                font-size: 15px;
            }

            .value::before {
                content: "";
            }
        }

        /* 鼠标悬停细腻反馈 */
        .info-item:hover .value {
            border-bottom-color: #b9c1cc;
        }

        /* 极简脚注（保留但弱化，不干扰主体） */
        .footer-note {
            margin-top: 28px;
            text-align: center;
            font-size: 12px;
            color: #dce0e6;
            letter-spacing: 0.5px;
            border-top: 1px solid #f1f3f5;
            padding-top: 16px;
        }

        .footer-note span {
            color: #cbd5e1;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- ★ 醒目标题 -->
        <div class="main-title">QSL Address</div>

        <!-- 收件人（原姓名） -->
        <div class="info-item"> 
            <span class="label">收 件 人</span>
            <span class="value">BG5GIZ</span>
        </div>

        <!-- 电子邮箱 -->
        <div class="info-item">
            <span class="label">电子邮箱</span>
            <span class="value">cq@bg5giz.com</span>
        </div>

        <!-- 联系方式 -->
        <div class="info-item">
            <span class="label">联系方式</span>
            <span class="value">18106503866</span>
        </div>

        <!-- 收件地址（原地址） -->
        <div class="info-item">
            <span class="label">收件地址</span>
            <span class="value"></span>
        </div>

        <!-- 邮政编码（原邮编） -->
        <div class="info-item">
            <span class="label">邮政编码</span>
            <span class="value">310000</span>
        </div>

        <!-- 极简脚注（可忽略） -->
        <div class="footer-note">
            <span>— VY 73! —</span>
        </div>
    </div>

</body>
</html>
