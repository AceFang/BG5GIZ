<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>个人信息</title>
    <style>
        /* 全局重置 & 基础 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f7fa;
            padding: 20px;
        }

        /* 卡片容器 —— 居中、舒适、不拥挤 */
        .card {
            max-width: 560px;
            width: 100%;
            background: #ffffff;
            border-radius: 20px;
            padding: 48px 40px 44px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06);
            transition: box-shadow 0.25s ease;
        }

        /* 每一条信息 */
        .info-item {
            display: flex;
            align-items: baseline;
            padding: 14px 0;
            border-bottom: 1px solid #eef0f2;
        }

        .info-item:last-of-type {
            border-bottom: none;
        }

        /* 左侧标签 */
        .label {
            width: 92px;
            flex-shrink: 0;
            font-size: 16px;
            font-weight: 500;
            color: #1e293b;
            letter-spacing: 0.3px;
        }

        /* 右侧内容（留空区域） */
        .value {
            flex: 1;
            font-size: 16px;
            color: #94a3b8;
            /* 浅灰色占位感，表示待填 */
            padding-left: 8px;
            min-height: 28px;
            border-bottom: 1.5px dashed #dce0e6;
            /* 虚线占位，清晰可见 */
            transition: border-color 0.2s;
        }

        /* 让占位更明显一点，但又不抢眼 */
        .value::before {
            content: "————————";
            color: #dce0e6;
            letter-spacing: 1px;
            font-weight: 300;
        }

        /* 为了更真实地 "空着让我来填"，保留空白占位符，
           但用户可以直接在 HTML 中替换 .value 的内容。
           如果用户想保留占位线，可以保留；如果要填入内容，
           直接修改 .value 的文本即可，并移除 ::before。 */

        /* 响应式：小屏下标签稍作调整 */
        @media (max-width: 480px) {
            .card {
                padding: 32px 20px 28px;
            }

            .info-item {
                flex-wrap: wrap;
                padding: 12px 0;
            }

            .label {
                width: 100%;
                font-size: 15px;
                margin-bottom: 4px;
            }

            .value {
                width: 100%;
                padding-left: 0;
                font-size: 15px;
            }

            .value::before {
                content: "——————————";
            }
        }

        /* 可选：鼠标悬停时给个细腻反馈 */
        .info-item:hover .value {
            border-bottom-color: #b9c1cc;
        }

        /* 页脚极简版权（可选），不影响主内容 */
        .footer-note {
            margin-top: 32px;
            text-align: center;
            font-size: 12px;
            color: #cbd5e1;
            letter-spacing: 0.5px;
            border-top: 1px solid #f1f3f5;
            padding-top: 20px;
        }

        .footer-note a {
            color: #cbd5e1;
            text-decoration: none;
        }

        .footer-note a:hover {
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- 姓名 -->
        <div class="info-item">
            <span class="label">姓名</span>
            <span class="value"></span>
        </div>

        <!-- 电子邮箱 -->
        <div class="info-item">
            <span class="label">电子邮箱</span>
            <span class="value"></span>
        </div>

        <!-- 联系方式 -->
        <div class="info-item">
            <span class="label">联系方式</span>
            <span class="value"></span>
        </div>

        <!-- 地址 -->
        <div class="info-item">
            <span class="label">地址</span>
            <span class="value"></span>
        </div>

        <!-- 邮编 -->
        <div class="info-item">
            <span class="label">邮编</span>
            <span class="value"></span>
        </div>

        <!-- 极简脚注（可删） -->
        <div class="footer-note">
            <a href="#" target="_blank">— 待填信息 —</a>
        </div>
    </div>

</body>
</html>
